<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Гиря каждый день</title>
<meta name="description" content="Ежедневная гиревая практика: план на сегодня, таймер, дневник и автоматическая прогрессия нагрузки.">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Гиря">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/styles.css?v=47">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-in">
        <div>
          <div class="topbar-title" id="topTitle">Сегодня</div>
          <div class="topbar-sub" id="topSub"></div>
        </div>
        <button class="icon-btn" id="topAction" hidden></button>
      </div>
    </header>

    <main id="screen" class="screen"></main>

    <div id="restbar" class="restbar" hidden></div>

    <nav class="tabs">
      <button class="tab is-active" data-tab="today"><span class="ti">▣</span>Сегодня</button>
      <button class="tab" data-tab="timer"><span class="ti">◷</span>Таймер</button>
      <button class="tab" data-tab="history"><span class="ti">☰</span>Дневник</button>
      <button class="tab" data-tab="progress"><span class="ti">◪</span>Прогресс</button>
      <button class="tab" data-tab="settings"><span class="ti">⚙</span>Ещё</button>
    </nav>
  </div>

  <div id="sheetWrap" class="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-close="1"></div>
    <div class="sheet" id="sheet"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="./js/app.js?v=47"></script>
  <script>
    // Если модуль не загрузился (обрыв связи, сбой хостинга), экран остаётся пустым
    // и человек не понимает, что произошло. Показываем понятное сообщение.
    window.__kbdBooted = false;
    setTimeout(function () {
      if (window.__kbdBooted) return;
      var s = document.getElementById('screen');
      if (!s || s.children.length) return;
      s.innerHTML = '<div class="card"><h2>Не загрузилось</h2>' +
        '<p class="muted">Похоже, оборвалась связь при первом запуске. Проверь интернет и обнови страницу — дальше приложение будет работать и без него.</p>' +
        '<button class="btn" onclick="location.reload()">Обновить</button></div>';
    }, 5000);
  </script>
</body>
</html>
